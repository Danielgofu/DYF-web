<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131313" />
    <!--
      Cabecera por ruta: title, description, robots, canonical, og:* y twitter:* se generan
      desde src/seo/rutas.json (fuente única). En desarrollo y en este index.html (portada) los
      escribe el plugin de vite.config.ts; tras el build, scripts/generar-cabeceras.mjs crea
      un .html por ruta (servicios.html, gracias.html, 404.html...) con su propio bloque.
    -->
    <!-- seo:inicio -->
    <!-- seo:fin -->

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="DYF Telecomunicaciones" />
    <meta property="og:image" content="https://www.dyfservicios.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logotipo de DYF Telecomunicaciones" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.dyfservicios.com/og-image.jpg" />

    <!-- Datos estructurados de negocio local (solo datos presentes en la web: contact.ts y Aviso Legal) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HomeAndConstructionBusiness",
      "@id": "https://www.dyfservicios.com/#empresa",
      "name": "DYF Telecomunicaciones",
      "legalName": "DYF Telecomunicaciones y Servicios, S.L.",
      "taxID": "B85223972",
      "url": "https://www.dyfservicios.com/",
      "logo": "https://www.dyfservicios.com/icon-512.png",
      "image": "https://www.dyfservicios.com/og-image.jpg",
      "email": "info@dyfservicios.com",
      "telephone": "+34916018494",
      "contactPoint": [
        { "@type": "ContactPoint", "telephone": "+34916018494", "contactType": "customer service" },
        { "@type": "ContactPoint", "telephone": "+34918312061", "contactType": "customer service" }
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "C. Valdemorillo, 20",
        "postalCode": "28901",
        "addressLocality": "Getafe",
        "addressRegion": "Madrid",
        "addressCountry": "ES"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "https://schema.org/Monday",
            "https://schema.org/Tuesday",
            "https://schema.org/Wednesday",
            "https://schema.org/Thursday",
            "https://schema.org/Friday"
          ],
          "opens": "09:00",
          "closes": "14:00"
        }
      ],
      "areaServed": { "@type": "AdministrativeArea", "name": "Comunidad de Madrid" },
      "sameAs": [
        "https://www.instagram.com/dyftelecomunicaciones",
        "https://www.facebook.com/DYFTelecomunicaciones/"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
